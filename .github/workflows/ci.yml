name: CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'docs/releases/**', 'package.json', 'package-lock.json', 'pnpm-lock.yaml', 'README.md', 'tsconfig.json', '.github/workflows/ci.yml', '.github/workflows/npm-release.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['src/**', 'tests/**', 'scripts/**', 'docs/releases/**', 'package.json', 'package-lock.json', 'pnpm-lock.yaml', 'README.md', 'tsconfig.json', '.github/workflows/ci.yml', '.github/workflows/npm-release.yml']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test tests/release-package.test.mjs
      - run: pnpm build
      - name: Verify actual tarball and three installed MCP client modes
        run: npm run verify:package
        env:
          SUNO_PROOF_ROOT: ${{ runner.temp }}/suno-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-proof-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/suno-proof/**/package-proof.json
            ${{ runner.temp }}/suno-proof/**/*.tgz
          if-no-files-found: error
          retention-days: 7

  build:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: package-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every operating system and Node version
        env:
          RESULT: ${{ needs.package-compatibility.result }}
        run: test "$RESULT" = success
